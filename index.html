<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    RO'LYFE Tactical Intelligence Center™
</title>


<style>

    /* ============================================
       RO'LYFE TACTICAL INTELLIGENCE CENTER
    ============================================ */

    * {
        box-sizing: border-box;
    }


    :root {

        --bg:
            #08110c;

        --panel:
            #101b14;

        --panel-2:
            #15231a;

        --border:
            #294234;

        --green:
            #00e676;

        --green-dark:
            #00a854;

        --text:
            #f2f7f3;

        --muted:
            #9aa89f;

        --danger:
            #ff5c5c;

        --gold:
            #ffd54f;

    }


    body {

        margin: 0;

        background:
            var(--bg);

        color:
            var(--text);

        font-family:
            Arial,
            Helvetica,
            sans-serif;

    }


    /* ============================================
       HEADER
    ============================================ */

    .app-header {

        padding:
            20px;

        text-align:
            center;

        border-bottom:
            1px solid var(--border);

        background:
            #0b130e;

    }


    .app-header h1 {

        margin:
            0;

        font-size:
            clamp(
                22px,
                5vw,
                34px
            );

        color:
            var(--green);

    }


    .app-header p {

        margin:
            8px 0 0;

        color:
            var(--muted);

        font-size:
            14px;

    }


    /* ============================================
       MAIN
    ============================================ */

    .container {

        width:
            min(
                1200px,
                100%
            );

        margin:
            auto;

        padding:
            20px;

    }


    /* ============================================
       CARDS
    ============================================ */

    .card {

        background:
            var(--panel);

        border:
            1px solid var(--border);

        border-radius:
            14px;

        padding:
            20px;

        margin-bottom:
            20px;

    }


    .card h2 {

        margin-top:
            0;

        color:
            var(--green);

    }


    /* ============================================
       FORM GRID
    ============================================ */

    .form-grid {

        display:
            grid;

        grid-template-columns:
            repeat(
                auto-fit,
                minmax(
                    220px,
                    1fr
                )
            );

        gap:
            15px;

    }


    .full-width {

        grid-column:
            1 / -1;

    }


    /* ============================================
       INPUTS
    ============================================ */

    label {

        display:
            block;

        margin-bottom:
            7px;

        color:
            var(--muted);

        font-size:
            13px;

        font-weight:
            bold;

    }


    input,
    select {

        width:
            100%;

        padding:
            13px;

        background:
            #08110c;

        border:
            1px solid var(--border);

        border-radius:
            8px;

        color:
            white;

        font-size:
            16px;

        outline:
            none;

    }


    input:focus,
    select:focus {

        border-color:
            var(--green);

    }


    /* ============================================
       BUTTONS
    ============================================ */

    button {

        border:
            none;

        border-radius:
            10px;

        padding:
            15px 20px;

        font-size:
            16px;

        font-weight:
            bold;

        cursor:
            pointer;

        background:
            var(--green);

        color:
            #061009;

        width:
            100%;

        margin-top:
            15px;

    }


    button:hover {

        opacity:
            .85;

    }


    /* ============================================
       OUTPUT
    ============================================ */

    #tradePlanOutput {

        min-height:
            100px;

    }


    .trade-plan-card {

        background:
            var(--panel);

        border:
            1px solid var(--green-dark);

        border-radius:
            14px;

        padding:
            20px;

        margin-top:
            20px;

    }


    .trade-plan-card h3 {

        margin-top:
            0;

        color:
            var(--green);

        text-align:
            center;

    }


    .plan-status {

        text-align:
            center;

        padding:
            8px;

        background:
            rgba(
                0,
                230,
                118,
                .12
            );

        color:
            var(--green);

        border-radius:
            8px;

        font-weight:
            bold;

        margin-bottom:
            20px;

    }


    .plan-section {

        background:
            var(--panel-2);

        border:
            1px solid var(--border);

        border-radius:
            10px;

        padding:
            15px;

        margin-bottom:
            15px;

    }


    .plan-section h4 {

        margin-top:
            0;

        color:
            var(--green);

    }


    .plan-section p {

        padding:
            8px 0;

        margin:
            0;

        border-bottom:
            1px solid rgba(
                255,
                255,
                255,
                .06
            );

    }


    .target-result {

        padding:
            15px;

        margin:
            10px 0;

        background:
            #0b130e;

        border-radius:
            8px;

    }


    .result-line {

        display:
            flex;

        flex-wrap:
            wrap;

        gap:
            10px;

        margin-top:
            10px;

        color:
            var(--muted);

    }


    .runner-box {

        padding:
            15px;

        background:
            rgba(
                255,
                213,
                79,
                .08
            );

        border:
            1px solid rgba(
                255,
                213,
                79,
                .25
            );

        border-radius:
            10px;

        color:
            var(--gold);

        margin-top:
            15px;

    }


    .trade-plan-actions {

        display:
            grid;

        grid-template-columns:
            1fr 1fr;

        gap:
            10px;

    }


    .trade-plan-actions button {

        background:
            var(--green-dark);

        color:
            white;

    }


    .plan-date {

        color:
            var(--muted);

        text-align:
            center;

        font-size:
            12px;

    }


/* ============================================
   RISK / REWARD TRADE MAP
============================================ */

.rr-chart {

    width:
        100%;

    padding:
        20px 10px 10px;

    overflow:
        hidden;

}


.rr-chart-header {

    text-align:
        center;

    color:
        var(--green);

    font-weight:
        bold;

    margin-bottom:
        35px;

}


.rr-chart-track {

    position:
        relative;

    height:
        90px;

    width:
        100%;

    border-top:
        3px solid var(--border);

    margin:
        35px 0 15px;

}


.rr-risk-zone {

    position:
        absolute;

    top:
        -8px;

    height:
        16px;

    background:
        rgba(
            255,
            92,
            92,
            .35
        );

    border:
        1px solid var(--danger);

    border-radius:
        10px;

}


.rr-reward-zone {

    position:
        absolute;

    top:
        -8px;

    height:
        16px;

    background:
        rgba(
            0,
            230,
            118,
            .25
        );

    border:
        1px solid var(--green);

    border-radius:
        10px;

}


.rr-marker {

    position:
        absolute;

    top:
        -25px;

    transform:
        translateX(
            -50%
        );

    text-align:
        center;

    font-size:
        11px;

    min-width:
        60px;

}


.rr-marker::after {

    content:
        "";

    position:
        absolute;

    left:
        50%;

    top:
        38px;

    width:
        2px;

    height:
        48px;

    transform:
        translateX(
            -50%
        );

    background:
        var(--muted);

}


.rr-marker span {

    display:
        block;

    font-weight:
        bold;

}


.rr-marker strong {

    display:
        block;

    margin-top:
        4px;

}


.rr-stop {

    color:
        var(--danger);

}


.rr-entry {

    color:
        white;

}


.rr-entry::after {

    background:
        white;

}


.rr-target {

    color:
        var(--green);

}


.rr-chart-legend {

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        20px;

    color:
        var(--muted);

    font-size:
        12px;

    margin-top:
        15px;

}


@media (
    max-width:
    600px
) {

    .rr-chart {

        overflow-x:
            auto;

    }


    .rr-chart-track {

        min-width:
            550px;

    }

}    
    
    /* ============================================
       MOBILE
    ============================================ */

    @media (
        max-width:
        600px
    ) {

        .container {

            padding:
                12px;

        }


        .card {

            padding:
                15px;

        }


        .trade-plan-actions {

            grid-template-columns:
                1fr;

        }

    }

</style>

</head><body><!-- ============================================
     HEADER
============================================= -->

<header class="app-header">

    <h1>
        🎯 RO'LYFE TACTICAL INTELLIGENCE CENTER™
    </h1>

    <p>
        PLAN → SIZE → LADDER → EXECUTE → JOURNAL → REVIEW
    </p>

</header>


<main class="container">


    <!-- ========================================
         MASTER TRADE PLANNER
    ========================================= -->

    <section class="card">

        <h2>
            📋 MASTER TRADE PLANNER
        </h2>


        <div class="form-grid">


            <!-- SYMBOL -->

            <div>

                <label>
                    Symbol
                </label>

                <input
                    id="symbol"
                    type="text"
                    placeholder="Example: NVDA"
                >

            </div>


            <!-- INSTRUMENT -->

            <div>

                <label>
                    Instrument
                </label>

                <select id="instrument">

                    <option value="Stock">
                        Stock
                    </option>

                    <option value="Option">
                        Option
                    </option>

                    <option value="Crypto">
                        Crypto
                    </option>

                </select>

            </div>


            <!-- DIRECTION -->

            <div>

                <label>
                    Direction
                </label>

                <select id="direction">

                    <option value="Long">
                        Long
                    </option>

                    <option value="Short">
                        Short
                    </option>

                </select>

            </div>


            <!-- ACCOUNT SIZE -->

            <div>

                <label>
                    Account Size
                </label>

                <input
                    id="accountSize"
                    type="number"
                    step="0.01"
                    placeholder="10000"
                >

            </div>


            <!-- RISK PERCENT -->

            <div>

                <label>
                    Risk Percentage
                </label>

                <input
                    id="riskPercent"
                    type="number"
                    step="0.01"
                    placeholder="1"
                >

            </div>


            <!-- PROBABILITY -->

            <div>

                <label>
                    Trade Probability %
                </label>

                <input
                    id="probability"
                    type="number"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="70"
                >

            </div>


            <!-- IMPLIED VOLATILITY -->

            <div>

                <label>
                    Implied Volatility %
                </label>

                <input
                    id="impliedVolatility"
                    type="number"
                    step="0.01"
                    placeholder="35"
                >

            </div>


            <!-- ====================================
                 STOCK MAP
            ===================================== -->

            <div class="full-width">

                <h3>
                    📈 STOCK / ASSET MAP
                </h3>

            </div>


            <!-- ENTRY -->

            <div>

                <label>
                    Entry Price
                </label>

                <input
                    id="entry"
                    type="number"
                    step="0.01"
                    placeholder="150"
                >

            </div>


            <!-- STOP -->

            <div>

                <label>
                    Stop Price
                </label>

                <input
                    id="stop"
                    type="number"
                    step="0.01"
                    placeholder="145"
                >

            </div>


            <!-- TARGET 1 -->

            <div>

                <label>
                    Manual Target 1 (Optional)
                </label>

                <input
                    id="target1"
                    type="number"
                    step="0.01"
                    placeholder="Auto 1R if blank"
                >

            </div>


            <!-- TARGET 2 -->

            <div>

                <label>
                    Manual Target 2 (Optional)
                </label>

                <input
                    id="target2"
                    type="number"
                    step="0.01"
                    placeholder="Auto 2R if blank"
                >

            </div>


            <!-- TARGET 3 -->

            <div>

                <label>
                    Manual Target 3 (Optional)
                </label>

                <input
                    id="target3"
                    type="number"
                    step="0.01"
                    placeholder="Auto 3R if blank"
                >

            </div>


            <!-- ====================================
                 OPTION EXECUTION
            ===================================== -->

            <div class="full-width">

                <h3>
                    🎯 OPTION EXECUTION
                </h3>

            </div>


            <!-- OPTION TYPE -->

            <div>

                <label>
                    Option Type
                </label>

                <select id="optionType">

                    <option value="Call">
                        Call
                    </option>

                    <option value="Put">
                        Put
                    </option>

                </select>

            </div>


            <!-- STRIKE -->

            <div>

                <label>
                    Strike Price
                </label>

                <input
                    id="strike"
                    type="number"
                    step="0.01"
                    placeholder="150"
                >

            </div>


            <!-- EXPIRATION -->

            <div>

                <label>
                    Expiration
                </label>

                <input
                    id="expiration"
                    type="date"
                >

            </div>


            <!-- OPTION ENTRY -->

            <div>

                <label>
                    Option Premium Entry
                </label>

                <input
                    id="optionEntry"
                    type="number"
                    step="0.01"
                    placeholder="2.53"
                >

            </div>


            <!-- OPTION DELTA -->

            <div>

                <label>
                    Option Delta
                </label>

                <input
                    id="optionDelta"
                    type="number"
                    step="0.01"
                    min="-1"
                    max="1"
                    placeholder="0.50"
                >

            </div>


            <!-- OPTION TARGET 1 -->

            <div>

                <label>
                    Option Target 1
                </label>

                <input
                    id="optionTarget1"
                    type="number"
                    step="0.01"
                    placeholder="3.00"
                >

            </div>


            <!-- OPTION TARGET 2 -->

            <div>

                <label>
                    Option Target 2
                </label>

                <input
                    id="optionTarget2"
                    type="number"
                    step="0.01"
                    placeholder="3.50"
                >

            </div>


            <!-- OPTION TARGET 3 -->

            <div>

                <label>
                    Option Target 3
                </label>

                <input
                    id="optionTarget3"
                    type="number"
                    step="0.01"
                    placeholder="4.00"
                >

            </div>


        </div>


        <!-- ========================================
             CREATE BUTTON
        ========================================= -->

        <button
            type="button"
            onclick="createTradePlan()"
        >

            🎯 CREATE MASTER TRADE PLAN

        </button>


    </section>


    <!-- ============================================
         OUTPUT
    ============================================= -->

    <section
        id="tradePlanOutput"
    >

        <!-- TRADE PLAN APPEARS HERE -->

    </section>


</main>


<!-- ================================================
     LOAD ENGINES
     
     ORDER IS IMPORTANT!
     
     1. Risk Engine
     2. Ladder Engine
     3. Journal
     4. Trade Planner
================================================= -->

<script src="js/risk-engine.js"></script>

<script src="js/ladder-engine.js"></script>

<script src="js/trade-journal.js"></script>

<script src="js/trade-planner.js"></script>


<!-- ================================================
     SAFE BUTTON FUNCTION
================================================= -->

<script>

    function createTradePlan() {

        console.log(
            "CREATE PLAN BUTTON CLICKED"
        );


        if (
            !window.TradePlanner
        ) {

            console.error(
                "TradePlanner is not loaded."
            );


            alert(
                "ERROR: Trade Planner is not loaded. Check the Console."
            );

            return;

        }


        if (
            typeof
            window.TradePlanner.createPlan
            !==
            "function"
        ) {

            console.error(
                "TradePlanner.createPlan() is missing."
            );


            alert(
                "ERROR: createPlan() function is missing."
            );

            return;

        }


        window.TradePlanner.createPlan();

    }


    window.addEventListener(

        "error",

        function(event) {

            console.error(
                "RO'LYFE SYSTEM ERROR:",
                event.message,
                event.filename,
                event.lineno
            );

        }

    );


    console.log(
        "🔥 RO'LYFE TACTICAL INTELLIGENCE CENTER ONLINE"
    );

</script>

</body>
    </html>
